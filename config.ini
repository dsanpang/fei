# Fei Distributed Control Platform Configuration

[system]
version = "3.0.0"
debug_mode = false
log_level = "INFO"

[network]
# Gateway settings
gateway_port = 4433
gateway_host = "0.0.0.0"

# NATS settings
nats_url = "nats://localhost:4222"
nats_max_reconnect = 10
nats_reconnect_wait = 2

# Control plane settings
control_plane_port = 8080
control_plane_host = "0.0.0.0"

[security]
# Encryption settings
encryption_algorithm = "chacha20-poly1305"
mtls_version = "1.3"
enable_random_padding = true
max_padding_length = 128

# Agent settings
agent_connection_timeout = 30
agent_heartbeat_interval = 30
agent_session_cleanup_interval = 120

[paths]
# Directory paths
templates_dir = "./templates"
output_dir = "./output"
logs_dir = "./logs"
config_dir = "./config"

[performance]
# Performance tuning
max_concurrent_connections = 1000
connection_pool_size = 100
message_queue_size = 10000

[features]
# Feature flags
enable_encryption = true
enable_compression = false
enable_audit_logging = true
enable_rate_limiting = true